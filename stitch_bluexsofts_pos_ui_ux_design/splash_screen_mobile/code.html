<style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #131313;
            font-family: 'Be Vietnam Pro', sans-serif;
        }

        .shimmer-glow {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at 50% 50%, rgba(108, 92, 231, 0.15) 0%, rgba(19, 19, 19, 0) 70%);
            animation: pulse-glow 8s ease-in-out infinite alternate;
            pointer-events: none;
        }

        @keyframes pulse-glow {
            0% { transform: scale(1); opacity: 0.5; }
            100% { transform: scale(1.2); opacity: 0.8; }
        }

        .loading-spinner {
            width: 48px;
            height: 48px;
            border: 3px solid rgba(198, 191, 255, 0.1);
            border-top: 3px solid #c6bfff;
            border-radius: 50%;
            animation: spin 1s cubic-bezier(0.4, 0, 0.2, 1) infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .brand-reveal {
            animation: reveal 1.2s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        @keyframes reveal {
            0% { opacity: 0; transform: translateY(20px); filter: blur(10px); }
            100% { opacity: 1; transform: translateY(0); filter: blur(0); }
        }

        .gradient-canvas {
            background: linear-gradient(135deg, #131313 0%, #1a1535 100%);
        }
    </style>

<!-- Interactive Mouse Trailing Effect -->
<div class="pointer-events-none fixed top-0 left-0 w-[400px] h-[400px] bg-primary/5 blur-[100px] rounded-full -translate-x-1/2 -translate-y-1/2 transition-opacity duration-700 opacity-0" id="glow-cursor"></div>
<script>
        // Micro-interaction: Mouse following glow
        const glow = document.getElementById('glow-cursor');
        
        window.addEventListener('mousemove', (e) => {
            glow.style.opacity = '1';
            glow.style.left = e.clientX + 'px';
            glow.style.top = e.clientY + 'px';
        });

        window.addEventListener('mouseleave', () => {
            glow.style.opacity = '0';
        });

        // Subtle parallax on device orientation (for mobile)
        if (window.DeviceOrientationEvent) {
            window.addEventListener('deviceorientation', (e) => {
                const logo = document.querySelector('img');
                if(logo) {
                    const x = e.beta / 10;
                    const y = e.gamma / 10;
                    logo.style.transform = `translate3d(${y}px, ${x}px, 0)`;
                }
            });
        }
    </script>
