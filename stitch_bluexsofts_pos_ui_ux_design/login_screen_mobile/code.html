<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Login | BluexSofts POS</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<style>
        body {
            font-family: 'Be Vietnam Pro', sans-serif;
            background: #131313;
            overflow: hidden;
        }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .glass-effect {
            backdrop-filter: blur(12px);
            background: rgba(32, 31, 31, 0.8);
            border: 1px solid rgba(255, 255, 255, 0.05);
        }
        @keyframes float {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
            100% { transform: translateY(0px); }
        }
        .animate-float {
            animation: float 6s ease-in-out infinite;
        }
    </style>
<script id="tailwind-config">
        tailwind.config = {
          darkMode: "class",
          theme: {
            extend: {
              "colors": {
                      "background": "#131313",
                      "surface-container": "#201f1f",
                      "secondary-fixed-dim": "#4bddb7",
                      "tertiary-fixed": "#ffdea7",
                      "outline-variant": "#474554",
                      "error-container": "#93000a",
                      "inverse-on-surface": "#313030",
                      "surface-tint": "#c6bfff",
                      "on-primary": "#2900a0",
                      "on-primary-fixed": "#160066",
                      "on-secondary": "#00382b",
                      "tertiary-fixed-dim": "#f0bf63",
                      "surface-variant": "#353534",
                      "on-tertiary-container": "#fff6ee",
                      "tertiary": "#f0bf63",
                      "error": "#ffb4ab",
                      "on-secondary-container": "#004233",
                      "on-primary-fixed-variant": "#4029ba",
                      "primary": "#c6bfff",
                      "secondary-fixed": "#6dfad2",
                      "primary-fixed": "#e4dfff",
                      "surface-dim": "#131313",
                      "on-background": "#e5e2e1",
                      "secondary-container": "#02b894",
                      "on-tertiary-fixed": "#271900",
                      "on-tertiary-fixed-variant": "#5e4200",
                      "on-tertiary": "#412d00",
                      "inverse-primary": "#5847d2",
                      "on-primary-container": "#faf6ff",
                      "on-surface-variant": "#c8c4d7",
                      "secondary": "#4bddb7",
                      "on-error-container": "#ffdad6",
                      "surface-container-highest": "#353534",
                      "outline": "#928ea0",
                      "surface": "#131313",
                      "primary-fixed-dim": "#c6bfff",
                      "on-secondary-fixed-variant": "#005140",
                      "inverse-surface": "#e5e2e1",
                      "surface-container-high": "#2a2a2a",
                      "surface-container-low": "#1c1b1b",
                      "tertiary-container": "#926b15",
                      "on-error": "#690005",
                      "on-surface": "#e5e2e1",
                      "surface-container-lowest": "#0e0e0e",
                      "on-secondary-fixed": "#002018",
                      "surface-bright": "#393939",
                      "primary-container": "#6c5ce7"
              },
              "borderRadius": {
                      "DEFAULT": "0.25rem",
                      "lg": "0.5rem",
                      "xl": "0.75rem",
                      "full": "9999px"
              },
              "spacing": {
                      "sm": "12px",
                      "margin-desktop": "40px",
                      "md": "16px",
                      "xs": "4px",
                      "margin-mobile": "16px",
                      "xl": "32px",
                      "base": "8px",
                      "gutter": "20px",
                      "lg": "24px"
              },
              "fontFamily": {
                      "headline-lg-mobile": ["Be Vietnam Pro"],
                      "headline-lg": ["Be Vietnam Pro"],
                      "title-md": ["Be Vietnam Pro"],
                      "body-lg": ["Be Vietnam Pro"],
                      "label-md": ["Be Vietnam Pro"],
                      "display-lg": ["Be Vietnam Pro"],
                      "body-sm": ["Be Vietnam Pro"]
              },
              "fontSize": {
                      "headline-lg-mobile": ["24px", {"lineHeight": "32px", "fontWeight": "600"}],
                      "headline-lg": ["32px", {"lineHeight": "40px", "letterSpacing": "-0.01em", "fontWeight": "600"}],
                      "title-md": ["20px", {"lineHeight": "28px", "fontWeight": "600"}],
                      "body-lg": ["16px", {"lineHeight": "24px", "fontWeight": "400"}],
                      "label-md": ["12px", {"lineHeight": "16px", "letterSpacing": "0.05em", "fontWeight": "600"}],
                      "display-lg": ["48px", {"lineHeight": "56px", "letterSpacing": "-0.02em", "fontWeight": "700"}],
                      "body-sm": ["14px", {"lineHeight": "20px", "fontWeight": "400"}]
              }
            },
          },
        }
    </script>
</head>
<body class="bg-background text-on-background min-h-screen flex items-center justify-center p-lg relative overflow-hidden">
<!-- Background Atmospheric Effect -->
<div class="absolute inset-0 z-0">

</div>
<!-- Background Decorative Elements -->
<div class="absolute top-[-10%] right-[-10%] w-64 h-64 bg-primary-container rounded-full blur-[120px] opacity-20"></div>
<div class="absolute bottom-[-10%] left-[-10%] w-80 h-80 bg-secondary rounded-full blur-[120px] opacity-10"></div>
<!-- Login Container -->
<main class="relative z-10 w-full max-w-[400px]">
<!-- Logo Area -->
<div class="flex flex-col items-center mb-xl animate-float">
<div class="w-20 h-20 mb-md bg-primary-container rounded-xl flex items-center justify-center shadow-2xl">
<span class="material-symbols-outlined text-on-primary-container !text-4xl" data-icon="storefront" style="font-variation-settings: 'FILL' 1;">storefront</span>
</div>
<h1 class="font-headline-lg-mobile text-headline-lg-mobile text-primary tracking-tight">BluexSofts POS</h1>
<p class="font-body-sm text-body-sm text-on-surface-variant">Modern Retail Solutions</p>
</div>
<!-- Form Card -->
<div class="glass-effect rounded-xl p-lg shadow-2xl">
<h2 class="font-title-md text-title-md mb-lg text-on-surface">Welcome back</h2>
<form class="space-y-lg" onsubmit="event.preventDefault();">
<!-- Email Field -->
<div class="space-y-xs">
<label class="font-label-md text-label-md text-on-surface-variant uppercase tracking-widest ml-1">Email Address</label>
<div class="relative group">
<div class="absolute inset-y-0 left-0 pl-md flex items-center pointer-events-none text-outline">
<span class="material-symbols-outlined text-[20px]" data-icon="mail">mail</span>
</div>
<input class="w-full bg-[#FFFFFF05] border-0 border-b-2 border-outline-variant focus:border-primary-container focus:ring-0 text-on-surface placeholder-outline font-body-lg text-body-lg pl-11 py-md transition-all rounded-t-lg" placeholder="merchant@bluexsofts.com" type="email"/>
</div>
</div>
<!-- Password Field -->
<div class="space-y-xs">
<label class="font-label-md text-label-md text-on-surface-variant uppercase tracking-widest ml-1">Password</label>
<div class="relative group">
<div class="absolute inset-y-0 left-0 pl-md flex items-center pointer-events-none text-outline">
<span class="material-symbols-outlined text-[20px]" data-icon="lock">lock</span>
</div>
<input class="w-full bg-[#FFFFFF05] border-0 border-b-2 border-outline-variant focus:border-primary-container focus:ring-0 text-on-surface placeholder-outline font-body-lg text-body-lg pl-11 py-md transition-all rounded-t-lg" placeholder="••••••••" type="password"/>
<div class="absolute inset-y-0 right-0 pr-md flex items-center cursor-pointer text-on-surface-variant hover:text-primary transition-colors">
<span class="material-symbols-outlined text-[20px]" data-icon="visibility">visibility</span>
</div>
</div>
<div class="flex justify-end">
<a class="font-label-md text-label-md text-primary hover:text-surface-tint transition-colors" href="#">Forgot Password?</a>
</div>
</div>
<!-- Action Buttons -->
<div class="pt-md space-y-md">
<button class="w-full bg-primary-container text-on-primary-container font-title-md text-title-md py-md rounded-xl shadow-lg hover:shadow-primary-container/20 active:scale-95 transition-all flex items-center justify-center gap-base">
<span>Sign In</span>
<span class="material-symbols-outlined" data-icon="login">login</span>
</button>
<div class="flex items-center gap-md">
<div class="h-[1px] flex-1 bg-outline-variant"></div>
<span class="font-label-md text-label-md text-outline">OR</span>
<div class="h-[1px] flex-1 bg-outline-variant"></div>
</div>
<!-- Biometric Option -->
<button class="w-full border border-outline-variant hover:bg-surface-variant/30 text-on-surface font-body-lg text-body-lg py-md rounded-xl transition-all flex items-center justify-center gap-md group">
<span class="material-symbols-outlined text-secondary group-hover:scale-110 transition-transform" data-icon="fingerprint" style="font-variation-settings: 'FILL' 0;">fingerprint</span>
                        Biometric Login
                    </button>
</div>
</form>
</div>
<!-- Footer Info -->
<footer class="mt-xl text-center">
<p class="font-body-sm text-body-sm text-outline">
                New to BluexSofts? <a class="text-secondary font-bold hover:underline" href="#">Contact Sales</a>
</p>
<div class="mt-lg flex justify-center gap-lg">
<span class="material-symbols-outlined text-outline text-[18px] cursor-help hover:text-on-surface transition-colors" data-icon="security" title="Secure Encryption">security</span>
<span class="material-symbols-outlined text-outline text-[18px] cursor-help hover:text-on-surface transition-colors" data-icon="language" title="English">language</span>
<span class="material-symbols-outlined text-outline text-[18px] cursor-help hover:text-on-surface transition-colors" data-icon="help" title="Help Center">help</span>
</div>
</footer>
</main>
<!-- Custom Cursor Glow -->
<div class="pointer-events-none fixed top-0 left-0 w-[400px] h-[400px] bg-primary-container/5 rounded-full blur-[100px] z-0 -translate-x-1/2 -translate-y-1/2 transition-opacity duration-300 opacity-0" id="cursor-glow"></div>
<script>
        // Micro-interaction for cursor glow
        const glow = document.getElementById('cursor-glow');
        document.addEventListener('mousemove', (e) => {
            glow.style.opacity = '1';
            glow.style.left = e.clientX + 'px';
            glow.style.top = e.clientY + 'px';
        });

        // Toggle password visibility
        const togglePass = document.querySelector('[data-icon="visibility"]');
        const passInput = document.querySelector('input[type="password"]');
        if(togglePass && passInput) {
            togglePass.parentElement.addEventListener('click', () => {
                const isPass = passInput.type === 'password';
                passInput.type = isPass ? 'text' : 'password';
                togglePass.textContent = isPass ? 'visibility_off' : 'visibility';
                togglePass.classList.toggle('text-primary');
            });
        }

        // Input focus animations
        const inputs = document.querySelectorAll('input');
        inputs.forEach(input => {
            input.addEventListener('focus', () => {
                input.parentElement.parentElement.classList.add('scale-[1.02]');
                input.parentElement.parentElement.style.transition = 'all 0.3s ease';
            });
            input.addEventListener('blur', () => {
                input.parentElement.parentElement.classList.remove('scale-[1.02]');
            });
        });
    </script>
</body></html>
