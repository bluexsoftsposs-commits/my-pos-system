<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
            display: inline-block;
            line-height: 1;
            text-transform: none;
            letter-spacing: normal;
            word-wrap: normal;
            white-space: nowrap;
            direction: ltr;
        }

        @keyframes scan-line {
            0% { top: 0%; opacity: 0; }
            10% { opacity: 1; }
            90% { opacity: 1; }
            100% { top: 100%; opacity: 0; }
        }

        .scanning-line {
            animation: scan-line 2.5s ease-in-out infinite;
            box-shadow: 0 0 15px 2px #6C5CE7;
        }

        .camera-vignette {
            background: radial-gradient(circle, transparent 40%, rgba(0,0,0,0.85) 100%);
        }

        .scanner-frame {
            position: relative;
            z-index: 10;
        }

        .scanner-frame::before, .scanner-frame::after,
        .scanner-corner-tr::before, .scanner-corner-tr::after {
            content: '';
            position: absolute;
            width: 32px;
            height: 32px;
            border-color: #6C5CE7;
            border-style: solid;
        }

        /* Top Left Corner */
        .scanner-frame::before {
            top: -2px;
            left: -2px;
            border-width: 4px 0 0 4px;
            border-top-left-radius: 12px;
        }

        /* Bottom Left Corner */
        .scanner-frame::after {
            bottom: -2px;
            left: -2px;
            border-width: 0 0 4px 4px;
            border-bottom-left-radius: 12px;
        }

        /* Top Right Corner Helper Class */
        .scanner-corner-tr::before {
            top: -2px;
            right: -2px;
            border-width: 4px 4px 0 0;
            border-top-right-radius: 12px;
        }

        /* Bottom Right Corner Helper Class */
        .scanner-corner-tr::after {
            bottom: -2px;
            right: -2px;
            border-width: 0 4px 4px 0;
            border-bottom-right-radius: 12px;
        }

        /* Custom backdrop-blur for focus effect */
        .scanner-mask {
            backdrop-filter: blur(2px);
        }
    </style>
</head>
<body class="bg-black text-on-surface font-poppins selection:bg-primary-container selection:text-white overflow-hidden h-screen w-full">
<!-- Simulated Camera View Background -->
<div class="fixed inset-0 z-0">
<div class="absolute inset-0 w-full h-full bg-cover bg-center" data-alt="A POV perspective of a modern retail shelf in a dimly lit designer boutique. Various high-end product boxes with clean minimalist typography and visible barcodes are arranged neatly. The lighting is moody and focused, with deep shadows and soft bokeh in the background, creating a professional and high-fidelity atmosphere. The color palette is dominated by dark greys and deep blacks with soft ambient light reflections." style="background-image: url('https://lh3.googleusercontent.com/aida-public/AB6AXuBCIG2KX_t6xzEXO3iR8_PEKCOpxmBON-UcxFimikcsVAmo8Xof05QME2XQm6BTVs8BAmjc3xhBwV_mbKSzAU1IuUky8-e3_2qqbAuJ3H01lONadtso1B5B3urj2HwoFgDEbbWkjWpK-x8JF-6_sN9X8OfFC6GeFUoFEwICmhpwNr5Y7d448cIoXTNFLpRSXCdYsT-64kZEZcwweQyrGDe3T0HKWbusRBFFbfAYS0QUSpmNfPPRw6GFVA')">
</div>
<div class="absolute inset-0 bg-black/40"></div>
<div class="absolute inset-0 camera-vignette"></div>
</div>
<!-- UI Overlay Layer -->
<div class="relative z-20 flex flex-col h-full w-full">
<!-- Top Toolbar -->
<header class="flex items-center justify-between px-6 pt-12 pb-6">
<button aria-label="Close scanner" class="w-12 h-12 flex items-center justify-center rounded-full bg-black/40 backdrop-blur-md text-white active:scale-90 transition-transform">
<span class="material-symbols-outlined text-[28px]" data-icon="close">close</span>
</button>
<div class="flex flex-col items-center">
<span class="text-white font-semibold tracking-wide text-body-lg">Scanning...</span>
<span class="text-on-surface-variant text-label-md">Point at product barcode</span>
</div>
<button aria-label="Toggle flashlight" class="w-12 h-12 flex items-center justify-center rounded-full bg-black/40 backdrop-blur-md text-white active:scale-90 transition-transform" id="flashlight-toggle">
<span class="material-symbols-outlined text-[28px]" data-icon="flashlight_on">flashlight_on</span>
</button>
</header>
<!-- Scanning Viewport -->
<main class="flex-grow flex items-center justify-center relative px-8">
<!-- The focused scan window -->
<div class="w-full max-w-sm aspect-[4/3] scanner-frame">
<div class="scanner-corner-tr absolute inset-0"></div>
<!-- Inner Area -->
<div class="absolute inset-0 overflow-hidden rounded-xl">
<!-- Animated Scan Line -->
<div class="scanning-line absolute left-0 right-0 h-1 bg-primary-container"></div>
</div>
<!-- Success Pulse Effect (Hidden by default) -->
<div class="absolute inset-0 bg-primary-container/20 opacity-0 transition-opacity duration-300 pointer-events-none rounded-xl border-2 border-primary-container" id="scan-feedback"></div>
</div>
<!-- Hint Text -->
<div class="absolute bottom-12 left-0 right-0 flex justify-center">
<p class="text-on-surface-variant text-body-sm bg-black/60 px-4 py-2 rounded-full backdrop-blur-sm">
                    Hold steady for focus
                </p>
</div>
</main>
<!-- Footer Actions -->
<footer class="px-6 pb-12 pt-6 flex flex-col items-center gap-6">
<button class="flex items-center gap-3 bg-primary-container hover:bg-primary-container/90 text-white px-8 py-4 rounded-full font-semibold shadow-xl active:scale-95 transition-all w-full max-w-xs justify-center" onclick="simulateScan()">
<span class="material-symbols-outlined" data-icon="keyboard">keyboard</span>
<span class="font-poppins uppercase tracking-wider text-sm">Manual Entry</span>
</button>
<div class="flex items-center gap-2 text-on-surface-variant/60">
<span class="material-symbols-outlined text-sm" data-icon="lock" style="font-variation-settings: 'FILL' 1;">lock</span>
<span class="text-[10px] font-medium uppercase tracking-[0.2em]">BluexSofts Encrypted</span>
</div>
</footer>
</div>
<!-- Dark Overlay for non-scan areas -->
<div class="fixed inset-0 z-10 pointer-events-none">
<!-- SVG Masking for the clear window -->
<svg class="w-full h-full">
<defs>
<mask id="mask">
<rect fill="white" height="100%" width="100%"></rect>
<!-- The cutout rect (needs to match the main viewport aspect) -->
<!-- In a real app, these coords would be dynamic based on the .scanner-frame position -->
<rect class="md:hidden" fill="black" height="30%" rx="12" width="80%" x="10%" y="30%"></rect>
</mask>
</defs>
<rect fill="rgba(0,0,0,0.7)" height="100%" mask="url(#mask)" width="100%"></rect>
</svg>
</div>
<script>
        // Simple Interaction Logic
        const flashlightBtn = document.getElementById('flashlight-toggle');
        let flashlightOn = false;

        flashlightBtn.addEventListener('click', () => {
            flashlightOn = !flashlightOn;
            const icon = flashlightBtn.querySelector('.material-symbols-outlined');
            
            if (flashlightOn) {
                flashlightBtn.classList.remove('bg-black/40');
                flashlightBtn.classList.add('bg-primary-container', 'text-on-primary-container');
                icon.textContent = 'flashlight_off';
                // Trigger a slight brightness boost to simulate flash
                document.body.style.filter = 'brightness(1.1)';
            } else {
                flashlightBtn.classList.add('bg-black/40');
                flashlightBtn.classList.remove('bg-primary-container', 'text-on-primary-container');
                icon.textContent = 'flashlight_on';
                document.body.style.filter = 'brightness(1)';
            }
        });

        // Simulate a successful scan for demo purposes
        function simulateScan() {
            const feedback = document.getElementById('scan-feedback');
            feedback.style.opacity = '1';
            
            // Haptic vibration feedback (simulated)
            if (window.navigator && window.navigator.vibrate) {
                window.navigator.vibrate(100);
            }

            setTimeout(() => {
                feedback.style.opacity = '0';
            }, 500);
        }

        // Randomly simulate success scan every 8 seconds for visual flair
        setInterval(() => {
            if (Math.random() > 0.7) simulateScan();
        }, 8000);
    </script>
</body></html>
