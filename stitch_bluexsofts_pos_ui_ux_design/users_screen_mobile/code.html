<script>
        document.addEventListener('DOMContentLoaded', () => {
            const containers = document.querySelectorAll('.swipe-container');
            
            containers.forEach(container => {
                const content = container.querySelector('.swipe-content');
                let startX = 0;
                let currentTranslate = 0;
                let isDragging = false;
                const threshold = -80; // Distance to snap open actions

                container.addEventListener('touchstart', (e) => {
                    startX = e.touches[0].clientX;
                    isDragging = true;
                    content.style.transition = 'none';
                });

                container.addEventListener('touchmove', (e) => {
                    if (!isDragging) return;
                    const diff = e.touches[0].clientX - startX;
                    // Only allow swiping left
                    if (diff < 0) {
                        currentTranslate = Math.max(diff, -160);
                        content.style.transform = `translateX(${currentTranslate}px)`;
                    } else if (diff > 0 && currentTranslate < 0) {
                        // Allow swiping back to close
                        currentTranslate = Math.min(0, currentTranslate + diff);
                        content.style.transform = `translateX(${currentTranslate}px)`;
                    }
                });

                container.addEventListener('touchend', () => {
                    isDragging = false;
                    content.style.transition = 'transform 0.3s cubic-bezier(0.4, 0, 0.2, 1)';
                    
                    if (currentTranslate < threshold) {
                        currentTranslate = -160; // Show both buttons
                    } else {
                        currentTranslate = 0;
                    }
                    content.style.transform = `translateX(${currentTranslate}px)`;
                });
            });

            // Toggle logic for visual state
            const toggles = document.querySelectorAll('.toggle-checkbox');
            toggles.forEach(toggle => {
                toggle.addEventListener('change', (e) => {
                    const card = e.target.closest('.swipe-content');
                    const statusText = card.querySelector('.text-label-md');
                    const profileArea = card.querySelector('.flex.items-center.gap-4');
                    
                    if (e.target.checked) {
                        statusText.innerText = 'Online';
                        statusText.className = 'text-secondary text-label-md';
                        profileArea.classList.remove('opacity-60');
                        profileArea.querySelector('img').classList.remove('grayscale');
                    } else {
                        statusText.innerText = 'Offline';
                        statusText.className = 'text-on-surface-variant text-label-md';
                        profileArea.classList.add('opacity-60');
                        profileArea.querySelector('img').classList.add('grayscale');
                    }
                });
            });
        });
    </script>
