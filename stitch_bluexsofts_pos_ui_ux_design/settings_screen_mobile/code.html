<!-- Custom Cursor Effect for Micro-interactions -->
<div class="pointer-events-none fixed inset-0 z-30 transition duration-300" id="glow" style="background: radial-gradient(600px at 0px 0px, rgba(198, 191, 255, 0.05), transparent 80%);"></div>
<script>
        const glow = document.getElementById('glow');
        window.addEventListener('mousemove', (e) => {
            const { clientX, clientY } = e;
            glow.style.background = `radial-gradient(600px at ${clientX}px ${clientY}px, rgba(198, 191, 255, 0.08), transparent 80%)`;
        });

        // Toggle micro-interaction
        const toggles = document.querySelectorAll('input[type="checkbox"]');
        toggles.forEach(toggle => {
            toggle.addEventListener('change', function() {
                const parent = this.closest('.w-full');
                if(this.checked) {
                    parent.style.backgroundColor = 'rgba(108, 92, 231, 0.05)';
                } else {
                    parent.style.backgroundColor = 'transparent';
                }
            });
        });
    </script>
