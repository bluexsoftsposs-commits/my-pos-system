<body class="bg-background text-on-background min-h-screen flex flex-col">

</div>

<div class="flex justify-between items-start">
<h3 class="font-title-md text-title-md text-on-surface">Artisan Croissant</h3>
<button class="text-error w-11 h-11 -mt-2 -mr-2 flex items-center justify-center active:scale-90 transition-transform">
<span class="material-symbols-outlined">delete</span>
</button>

<span class="font-title-md text-title-md text-primary">$4.50</span>
<!-- Stepper -->

<span class="material-symbols-outlined text-[18px]">remove</span>
</button>
<span class="font-body-lg text-body-lg w-4 text-center">2</span>
<button class="w-8 h-8 rounded-full bg-surface-container flex items-center justify-center active:bg-primary-container active:text-on-primary-container transition-colors">
<span class="material-symbols-outlined text-[18px]">add</span>
</button>
</div>
</div>
</div>
</div>
<!-- Item 2: Cold Brew -->
<div class="bg-surface-container rounded-xl p-4 flex gap-4 items-center">
<div class="w-20 h-20 rounded-lg overflow-hidden flex-shrink-0 bg-surface-variant">
<img class="w-full h-full object-cover" data-alt="A chilled glass of dark, rich cold brew coffee with a few square ice cubes, captured in a minimalist studio setting. The lighting is cool-toned and dramatic, creating sleek reflections on the glassware against a dark, textured background. The image evokes a sense of refreshing energy and professional craftsmanship, aligned with the Indigo-themed modern POS interface." src="https://lh3.googleusercontent.com/aida-public/AB6AXuAsihNxj7uFqZscE4Kyb6m_T728uKHs7zyBsPy2DYdkFzNyl2guYmdWBkQgGl7fFjM45IXpbMKxuNyJOgETjUSiey0jGAza2RZHMPAxQMQMzeKz6T-phxdxQTB4M2ijJV99Qf-aZVvxR3jhyRCwsUuhhD7Y29CD0OdWRHcSLWu7BoV_DoIWnQLG1r9zPjbC38tPWX8Zlf6_WheefdKb943HXhjywmDP4I9_L-0I4jT0hHJWqM8o1_5XcQ"/>
</div>
<div class="flex-1">
<div class="flex justify-between items-start">

<div class="flex justify-between items-center">

<!-- Stepper -->

<span class="material-symbols-outlined" data-icon="home">home</span>
<span class="font-label-md text-label-md">Home</span>
</a>
<a class="flex flex-col items-center justify-center bg-primary-container text-on-primary-container rounded-xl px-4 py-1 active:scale-90 transition-transform" href="#">
<span class="material-symbols-outlined" data-icon="point_of_sale" style="font-variation-settings: 'FILL' 1;">point_of_sale</span>
<span class="font-label-md text-label-md">POS</span>
</a>
<a class="flex flex-col items-center justify-center text-on-surface-variant px-4 py-1 hover:bg-surface-container-highest transition-colors active:scale-90" href="#">
<span class="material-symbols-outlined" data-icon="inventory_2">inventory_2</span>
<span class="font-label-md text-label-md">Products</span>
</a>
<a class="flex flex-col items-center justify-center text-on-surface-variant px-4 py-1 hover:bg-surface-container-highest transition-colors active:scale-90" href="#">
<span class="material-symbols-outlined" data-icon="payments">payments</span>
<span class="font-label-md text-label-md">Sales</span>
</a>
<a class="flex flex-col items-center justify-center text-on-surface-variant px-4 py-1 hover:bg-surface-container-highest transition-colors active:scale-90" href="#">
<span class="material-symbols-outlined" data-icon="settings">settings</span>
<span class="font-label-md text-label-md">Settings</span>
</a>
</nav>
<script>
        // Micro-interactions for steppers
        document.querySelectorAll('button').forEach(button => {
            button.addEventListener('touchstart', function() {
                this.classList.add('active:scale-95');
            });
        });

        // Simple mock behavior for quantity buttons
        document.querySelectorAll('.flex.items-center.bg-surface-container-highest').forEach(stepper => {
            const countDisplay = stepper.querySelector('.font-body-lg');
            const buttons = stepper.querySelectorAll('button');
            
            buttons[0].addEventListener('click', () => {
                let count = parseInt(countDisplay.textContent);
                if (count > 1) countDisplay.textContent = count - 1;
            });
            
            buttons[1].addEventListener('click', () => {
                let count = parseInt(countDisplay.textContent);
                countDisplay.textContent = count + 1;
            });
        });
    </script>
</body></html>
