services:
  - type: web
    name: my-pos-system-2-api
    env: node
    buildCommand: cd backend && npm install && npx prisma generate && npx prisma migrate deploy && npx prisma db seed && npm run build
    startCommand: cd backend && npm start
    healthCheckPath: /health

  - type: web
    name: my-pos-system-2
    env: static
    buildCommand: cd bluexsofts_pos && flutter build web --release
    staticPublishPath: bluexsofts_pos/build/web
