name: bluexsofts_pos
description: "BluexSofts POS - Multi-tenant SaaS Point of Sale System"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Networking
  http: ^1.2.2

  # State management
  provider: ^6.1.2

  # Local storage & offline support
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # Auth persistence
  shared_preferences: ^2.3.2

  # Receipt printing
  pdf: ^3.11.1
  printing: ^5.13.2

  # Connectivity
  connectivity_plus: ^6.1.0

  # Open URLs (mobile payment redirect)
  url_launcher: ^6.3.0

  # Unique IDs
  uuid: ^4.5.1

  # Date/time formatting
  intl: ^0.19.0

  # Icons
  cupertino_icons: ^1.0.8

  # Charts for reports
  fl_chart: ^0.69.0

  # Image
  cached_network_image: ^3.4.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  hive_generator: ^2.0.1
  build_runner: ^2.4.12

flutter:
  uses-material-design: true
  assets:
    - assets/images/
  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Regular.ttf
        - asset: assets/fonts/Poppins-Medium.ttf
          weight: 500
        - asset: assets/fonts/Poppins-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Poppins-Bold.ttf
          weight: 700
